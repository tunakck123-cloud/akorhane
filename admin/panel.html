
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101010">
  <title>AKORHANE | Yönetim</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>
  <script src="panel.js" defer></script>
</head>
<body>
  <main class="admin-page">
    <header class="admin-header">
      <a class="logo" href="../index.html">AKOR<span>HANE</span></a>
      <button id="logoutButton" class="gold-button" type="button">ÇIKIŞ YAP</button>
    </header>

    <section class="admin-dashboard">
      <div class="eyebrow">YÖNETİM PANELİ</div>
      <h1>İçeriği <span>yönet.</span></h1>
      <p class="muted" id="adminStatus">Yetki kontrol ediliyor...</p>

      <section class="admin-section">
        <h2>Sanatçı yönetimi</h2>
        <p class="muted">Arşive sanatçı ekle veya mevcut sanatçıları düzenle.</p>

        <form id="artistForm" class="admin-form">
          <input type="hidden" id="artistOriginalId">

          <label for="artistName">Sanatçı adı</label>
          <input id="artistName" type="text" placeholder="Örn. Duman" required>

          <label for="artistId">Sanatçı kimliği</label>
          <input id="artistId" type="text" placeholder="Örn. duman" required>

          <label for="artistLanguage">Dil</label>
          <select id="artistLanguage">
            <option value="Türkçe">Türkçe</option>
            <option value="İngilizce">İngilizce</option>
            <option value="Diğer">Diğer</option>
          </select>

          <label for="artistGenre">Müzik türü</label>
          <input id="artistGenre" type="text" placeholder="Örn. Rock">

          <label for="artistInitial">Kart harfi</label>
          <input id="artistInitial" type="text" maxlength="2" placeholder="D">

          <label class="publish-option">
            <input id="artistPublished" type="checkbox" checked>
            Sitede yayınla
          </label>

          <div class="admin-actions">
            <button class="gold-button" type="submit" id="artistSaveButton">
              SANATÇI EKLE
            </button>
            <button type="button" id="artistCancelButton" class="secondary-button">
              TEMİZLE
            </button>
          </div>

          <p id="artistMessage" role="status"></p>
        </form>

        <h3>Mevcut sanatçılar</h3>
        <div id="artistList" class="admin-list">
          Yükleniyor...
        </div>
      </section>

      <section class="admin-section">
        <h2>Şarkı yönetimi</h2>
        <p class="muted">Şarkı ekleme, söz düzenleme ve akor yerleştirme alanı sıradaki aşamada hazırlanacak.</p>
      </section>
    </section>
  </main>
</body>
</html>
